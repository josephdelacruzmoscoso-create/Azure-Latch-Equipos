<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alineación y Calificaciones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Contenedor principal que envuelve toda la interfaz */
        .contenedor-principal {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            background-color: #222;
            overflow: hidden; /* Evita scroll indeseado */
        }

        /* Menú de químicas fijo a la izquierda */
        .menu-quimicas {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .menu-quimicas h2 {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            color: #4CAF50;
        }

        .menu-quimicas ul {
            list-style: none;
        }

        .menu-quimicas li {
            padding: 10px;
            background-color: #444;
            margin-bottom: 10px;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s;
        }

        .menu-quimicas li:hover {
            background-color: #555;
        }

        /* Estadio centrado */
        .estadio {
            position: relative;
            width: 600px;
            height: 800px;
            background-color: #2e7d32;
            border: 5px solid white;
            border-radius: 10px;
            background-image: linear-gradient(to bottom, transparent 49.5%, white 49.5%, white 50.5%, transparent 50.5%);
        }

        .estadio::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border: 3px solid white;
            border-radius: 50%;
        }

        /* Distribución de los jugadores en la cancha (Ejemplo 4-3-3) */
        .fila-jugadores {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            position: absolute;
            z-index: 2; /* Por encima de las líneas de la cancha */
        }

        .delanteros { top: 10%; }
        .mediocampistas { top: 35%; }
        .defensas { top: 65%; }
        .portero { top: 85%; justify-content: center; }

        /* Tarjetas de los jugadores */
        .jugador {
            width: 100px;
            height: 140px;
            background-color: #222;
            border: 2px solid #ffd700;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            text-align: center;
        }

        .jugador-rating {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }

        .jugador-nombre {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .jugador-stats {
            font-size: 10px;
            color: #ccc;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            width: 100%;
        }

    </style>
</head>
<body>
